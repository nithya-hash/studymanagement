{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Study Management{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'study/css/styles.css' %}">
</head>
<body>
  <header class="navbar">
    <a href="{% url 'dashboard' %}" class="brand">StudyManager</a>
    {% if user.is_authenticated %}
    <nav>
      <a href="{% url 'dashboard' %}">Dashboard</a>
      <a href="{% url 'subject_list' %}">Subjects</a>
      <a href="{% url 'task_list' %}">Tasks</a>
      <a href="{% url 'timetable' %}">Timetable</a>
      <form method="post" action="{% url 'logout' %}" class="inline">
        {% csrf_token %}
        <button type="submit" class="link-btn">Logout ({{ user.username }})</button>
      </form>
    </nav>
    {% endif %}
  </header>

  <main class="container">
    {% for message in messages %}
      <div class="alert {{ message.tags }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>

  <script src="{% static 'study/js/script.js' %}"></script>
</body>
</html>
